[project]
name = "sali"
version = "0.1.0"
description = "Analyze and compare supermarket prices, and recommend cheaper alternatives."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "attrs>=26.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "open-supermarkets-api-client",
    "openai>=2.0.0",
    "playwright>=1.50.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
sali = "sali.main:main"
sali-api = "sali.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sali"]

[tool.uv.workspace]
members = [
    "src/supermarket-api-client",
]

[tool.uv.sources]
open-supermarkets-api-client = { workspace = true }


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
