[project]
name = "sali"
version = "0.1.0"
description = "Analyze and compare supermarket prices, and recommend cheaper alternatives."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sali = "sali.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sali"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
